version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB_NAME=veribrand_db
      - JWT_SECRET=production_super_secret_key_veribrand_2026
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
