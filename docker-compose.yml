version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB_NAME=veribrand_db
      - JWT_SECRET=${JWT_SECRET:-dev_insecure_jwt_secret_for_local_docker_eval_only_change_in_production}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
